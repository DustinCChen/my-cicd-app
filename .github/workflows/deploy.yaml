# 流水线的名字
name: Deploy Frontend to GitHub Pages

# 触发条件：当有代码 push 到 main 分支时触发
on:
  push:
    branches: ["main"]

# 配置读写权限，允许流水线将文件发布到 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 定义具体的工作流 (Jobs)
jobs:
  # 阶段 1：构建 (CI)
  build:
    runs-on: ubuntu-latest  # 向 GitHub 申请一台最新的 Ubuntu 虚拟机
    steps:
      - name: 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 2. 配置 Bun 环境
        uses: oven-sh/setup-bun@v1  # 使用官方的 Bun 自动化动作
        with:
          bun-version: latest

      - name: 3. 安装依赖
        run: bun install

      - name: 4. 打包编译项目
        run: bun run build

      - name: 5. 提取产物准备发布
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist  # Vite 默认的打包输出目录是 dist

  # 阶段 2：部署 (CD)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build  # 只有上面的 build 阶段成功了，才会执行部署
    steps:
      - name: 执行发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4